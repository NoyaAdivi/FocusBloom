<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="נבנה באהבה על ידי נויה אדיבי" xmlns:c2pa="http://c2pa.org/manifest">
