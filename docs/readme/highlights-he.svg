<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="מה מיוחד בו" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6DE"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#D9F3E7"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
<path id="pt" d="M0-34C-15-50-17-80 0-96 17-80 15-50 0-34Z"/><clipPath id="c"><rect width="1200" height="150" rx="28"/></clipPath></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}.b3{animation-duration:17s}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.rise{animation:rise .9s ease-out both}.r2{animation-delay:.2s}.r3{animation-delay:.4s}
.spin{animation:spin 26s linear infinite}
.bloom{animation:bloom 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.ring{animation:ring 6s linear infinite}
.hand{animation:spin 6s linear infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bloom{0%,100%{transform:scale(.82)}50%{transform:scale(1.08)}}
@keyframes ring{from{stroke-dashoffset:302}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)"><rect width="1200" height="150" fill="url(#bg)"/><circle class="blob" cx="110" cy="140" r="95" fill="#CFC8FF" opacity=".5"/><circle class="blob b2" cx="1090" cy="20" r="105" fill="#A9E3CD" opacity=".42"/>
<use class="tw" href="#s" x="290" y="50" fill="#FFB4A2"/><use class="tw t2" href="#s" x="190" y="104" fill="#B3A9FA"/><use class="tw t3" href="#s" x="910" y="50" fill="#F5B8C8"/><use class="tw" href="#s" x="1010" y="104" fill="#A9E3CD"/>
<g transform="translate(600 30)"><g class="bob d1"><text font-size="30" text-anchor="middle" y="0">✨</text></g></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle"><text x="600" y="84" font-size="44" font-weight="800" fill="url(#t)" direction="rtl">מה מיוחד בו</text><text x="600" y="120" font-size="22" fill="#7A6B88" direction="rtl">למה FocusBloom באמת עוזר להתרכז</text></g>
<g transform="translate(600 140)"><g class="bob"><path d="M-10-5l10 9 10-9" fill="none" stroke="#6F60F0" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
