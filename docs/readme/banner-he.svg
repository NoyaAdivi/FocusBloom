<text class="rise r2" x="1140" y="178" font-size="27" fill="#7A6B88" text-anchor="start" direction="rtl">פומודורו שחוסם הסחות דעת רק כשמתמקדים</text><g class="rise r3"><rect x="918" y="224" width="222" height="44" rx="22" fill="#fff" fill-opacity=".72" stroke="#B3A9FA" stroke-width="2"/><text x="1029.0" y="253" font-size="19" font-weight="700" fill="#5548C8" text-anchor="middle" direction="rtl">🍅 טיימר פומודורו</text></g><g class="rise r3"><rect x="704" y="224" width="200" height="44" rx="22" fill="#fff" fill-opacity=".72" stroke="#B3A9FA" stroke-width="2"/><text x="804.0" y="253" font-size="19" font-weight="700" fill="#5548C8" text-anchor="middle" direction="rtl">🛡️ חסימת אתרים</text></g><g class="rise r3"><rect x="457" y="224" width="233" height="44" rx="22" fill="#fff" fill-opacity=".72" stroke="#B3A9FA" stroke-width="2"/><text x="573.5" y="253" font-size="19" font-weight="700" fill="#5548C8" text-anchor="middle" direction="rtl">🌍 עברית · English</text></g></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
