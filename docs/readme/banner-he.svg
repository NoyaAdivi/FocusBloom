<g transform="translate(230 165) scale(1.05)"><g class="bob"><g class="spin"><g transform="rotate(0)"><use class="bloom" href="#pt" fill="#FFB4A2" style="animation-delay:-0.00s" opacity=".92"/></g><g transform="rotate(30)"><use class="bloom" href="#pt" fill="#B3A9FA" style="animation-delay:-0.33s" opacity=".92"/></g><g transform="rotate(60)"><use class="bloom" href="#pt" fill="#A9E3CD" style="animation-delay:-0.66s" opacity=".92"/></g><g transform="rotate(90)"><use class="bloom" href="#pt" fill="#F5B8C8" style="animation-delay:-0.99s" opacity=".92"/></g><g transform="rotate(120)"><use class="bloom" href="#pt" fill="#FFE3A3" style="animation-delay:-1.32s" opacity=".92"/></g><g transform="rotate(150)"><use class="bloom" href="#pt" fill="#CFC8FF" style="animation-delay:-1.65s" opacity=".92"/></g><g transform="rotate(180)"><use class="bloom" href="#pt" fill="#FFB4A2" style="animation-delay:-1.98s" opacity=".92"/></g><g transform="rotate(210)"><use class="bloom" href="#pt" fill="#B3A9FA" style="animation-delay:-2.31s" opacity=".92"/></g><g transform="rotate(240)"><use class="bloom" href="#pt" fill="#A9E3CD" style="animation-delay:-2.64s" opacity=".92"/></g><g transform="rotate(270)"><use class="bloom" href="#pt" fill="#F5B8C8" style="animation-delay:-2.97s" opacity=".92"/></g><g transform="rotate(300)"><use class="bloom" href="#pt" fill="#FFE3A3" style="animation-delay:-3.30s" opacity=".92"/></g><g transform="rotate(330)"><use class="bloom" href="#pt" fill="#CFC8FF" style="animation-delay:-3.63s" opacity=".92"/></g></g>
<circle r="48" fill="#fff"/><circle r="48" fill="none" stroke="#F1EEFF" stroke-width="9"/>
<circle class="ring" r="48" fill="none" stroke="url(#t)" stroke-width="9" stroke-linecap="round" stroke-dasharray="302" transform="rotate(-90)"/>
