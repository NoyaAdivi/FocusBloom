<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FocusBloom 🌸</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <i class="b1"></i><i class="b2"></i><i class="b3"></i>
    <span class="star s1">✦</span><span class="star s2">✦</span><span class="star s3">✦</span><span class="star s4">✦</span>
  </div>

  <main class="card">
    <div class="flower" aria-hidden="true">
      <img src="../icons/logo.svg" alt="">
    </div>
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="site" id="site"></p>
    <div class="timer"><span id="left">--:--</span><small id="leftLabel"></small></div>
    <blockquote id="quote"></blockquote>
    <div class="actions">
      <button id="back" class="btn primary"></button>
      <button id="lang" class="btn ghost">עברית</button>
    </div>
  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>
