<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FocusBloom</title>
  <link rel="stylesheet" href="popup.css">
<style>.built-by{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.45em;margin:.6em 0;font-weight:600}.built-by a{display:inline-flex;align-items:center;gap:.4em;padding:.28em .8em;border-radius:999px;font-weight:800;text-decoration:none;color:inherit;background:rgba(10,102,194,.1);transition:transform .25s ease,background .25s ease,box-shadow .25s ease}.built-by a:hover,.built-by a:focus-visible{transform:translateY(-2px);background:rgba(10,102,194,.18);box-shadow:0 6px 16px rgba(10,102,194,.18)}.built-by svg{width:1.1em;height:1.1em;fill:#0A66C2;flex:none;transition:transform .35s ease}.built-by a:hover svg{transform:rotate(-8deg) scale(1.12)}html[lang="he"] .built-by .bb-en,html:not([lang="he"]) .built-by .bb-he{display:none}@media (prefers-reduced-motion:reduce){.built-by a,.built-by svg{transition:none}}</style>
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <img class="logo" src="../icons/logo.svg" alt="">
    <div class="brand">
      <b>FocusBloom</b>
      <small data-t="tagline"></small>
    </div>
    <button id="theme" class="chip icon" title="Dark mode">🌙</button>
    <button id="lang" class="chip" title="עברית / English">עב</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="timer" data-t="tabTimer" role="tab"></button>
    <button class="tab" data-tab="sites" data-t="tabSites" role="tab"></button>
    <button class="tab" data-tab="stats" data-t="tabStats" role="tab"></button>
    <span class="tab-ink" aria-hidden="true"></span>
  </nav>

  <!-- TIMER -->
  <section id="timer" class="panel show">
    <div class="ring-wrap">
      <svg class="petals" viewBox="0 0 200 200" aria-hidden="true">
        <defs><path id="petal" d="M100 100C88 84 86 58 100 44 114 58 112 84 100 100Z"/></defs>
        <g id="petal-group"></g>
      </svg>
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="62" class="track"/>
        <circle cx="100" cy="100" r="62" class="bar" id="bar"/>
      </svg>
      <div class="clock">
        <span id="phase" class="phase"></span>
        <span id="time" class="time">25:00</span>
        <span id="cycles" class="dots"></span>
      </div>
    </div>

    <div class="controls">
      <button id="start" class="btn primary" data-t="start"></button>
      <button id="pause" class="btn" data-t="pause" hidden></button>
      <button id="skip" class="btn ghost" data-t="skip" title=""></button>
      <button id="reset" class="btn ghost" data-t="reset"></button>
    </div>

    <div class="mode">
      <span data-t="blockWhen"></span>
      <div class="seg" id="mode">
        <button data-mode="pomodoro" data-t="modePomodoro"></button>
        <button data-mode="always" data-t="modeAlways"></button>
        <button data-mode="off" data-t="modeOff"></button>
      </div>
    </div>
    <p id="status" class="status"></p>
  </section>

  <!-- SITES -->
  <section id="sites" class="panel">
    <form id="add-form" class="add">
      <input id="site-input" type="text" autocomplete="off" spellcheck="false">
      <button class="btn primary small" data-t="add"></button>
    </form>
    <button id="add-current" class="btn soft wide"></button>
    <ul id="site-list" class="sites"></ul>
    <p id="empty" class="empty" data-t="empty" hidden></p>
  </section>

  <!-- STATS -->
  <section id="stats" class="panel">
    <div class="cards">
      <div class="card peach"><b id="st-sessions">0</b><span data-t="stSessions"></span></div>
      <div class="card lilac"><b id="st-minutes">0</b><span data-t="stMinutes"></span></div>
      <div class="card mint"><b id="st-hits">0</b><span data-t="stHits"></span></div>
    </div>
    <h4 data-t="durations"></h4>
    <div class="durations">
      <label><span data-t="focus"></span><input type="number" id="focusMin" min="1" max="120"></label>
      <label><span data-t="shortBreak"></span><input type="number" id="breakMin" min="1" max="60"></label>
      <label><span data-t="longBreak"></span><input type="number" id="longBreakMin" min="1" max="90"></label>
      <label><span data-t="cyclesLong"></span><input type="number" id="cyclesBeforeLong" min="2" max="8"></label>
    </div>
    <a class="gh" href="https://github.com/NoyaAdivi/FocusBloom" target="_blank" rel="noopener" data-t="source"></a>
    <p class="built-by"><span class="bb-en">Built by</span><span class="bb-he">נבנה על ידי</span> <a href="https://www.linkedin.com/in/noya-adivi/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.73V1.73C24 .77 23.21 0 22.23 0z"/></svg><span class="bb-en">Noya</span><span class="bb-he">נויה</span></a></p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
